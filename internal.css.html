<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body {
            background-color: rgba(255, 255, 224, 0.126);
            font-family: Arial, sans-serif;
        }

        h1 {
            color: rgb(0, 255, 94);
            text-align: center;
        }

        h2 {
            color: rgb(100, 93, 0);
        }

        p {
            color: rgb(61, 42, 165);
            font-size: 18px;
        }

        button {
            background-color: rgb(255, 0, 85);
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Welcome to SRM University</h1>

    <h2>Department of Electrical Science Engineering</h2>

    <p>
        We are learning Internal CSS in
        Full Stack Frontend Development.
    </p>

    <p>
        Internal CSS can style multiple elements
        within the same webpage.
    </p>

    <button>Learn More</button>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Styled Table</title>

    
</head>
<title>Styled Table</title>
    <link rel="stylesheet" href="style.css">
<body>

    <h2>Student Details</h2>

    <table border="1">
        <caption>weekly class schedule</caption>

        <tr>
            <th>Day</th>
            <th>9-10 AM</th>
            <th>10-11 AM</th>
            <th>11-12 AM</th>
        </tr>

        <tr>
            <td rowspan="2">Monday</td>
            <td>java</td>
            <td>DSA</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Python</td>
            <td colspan="2">Lab Session</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>python</td>
            <td>java</td>
            <td>maths</td>
        </tr>

        <tr>
            <td>wednesday</td>
            <td colspan="2">Lab Session</td>
            <td>DSA</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>DSA</td>
            <td>Python</td>
            <td>Java</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>HTML</td>
            <td>Maths</td>
            <td>DSA</td>
        </tr>
    </table>

    <h2>Sales Report</h2>

    <table border="1">
        <tr>
            <th>Product</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>50000</td>
        </tr>

        <tr>
            <td>Mobile</td>
            <td>20000</td>
        </tr>

        <tr class="total">
            <td>Total</td>
            <td>70000</td>
        </tr>
    </table>

</body>
</html>
